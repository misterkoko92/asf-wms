{% load i18n %}

<div class="scan-field ui-comp-panel">
  <label class="form-label" for="id_destination">{% trans "Destination" %}</label>
  <div class="scan-inline">
    {{ form.destination }}
    <a class="scan-scan-btn btn btn-tertiary" href="{% url 'admin:wms_destination_add' %}" target="_blank" rel="noopener">
      {% trans "Ajouter destination" %}
    </a>
  </div>
  <p class="scan-help ui-comp-note">{% trans "Merci de sélectionner une destination pour poursuivre la création de l'expédition" %}</p>
  {% for error in form.destination.errors %}
    <div class="scan-message error">{{ error }}</div>
  {% endfor %}
</div>
