{% load i18n static %}

<section id="scan-imports-locations" class="scan-card card border-0 ui-comp-card">
  <h2 class="ui-comp-title">{% trans "Import emplacements" %}</h2>
  <form method="post" class="scan-filters ui-comp-form">
    {% csrf_token %}
    <input type="hidden" name="action" value="location_single">
    <div class="scan-inline scan-inline-equal">
      <div class="scan-field">
        <label class="form-label" for="loc_warehouse">{% trans "Entrepôt" %}</label>
        <input type="text" id="loc_warehouse" name="warehouse" required>
      </div>
      <div class="scan-field">
        <label class="form-label" for="loc_zone">Rack</label>
        <input type="text" id="loc_zone" name="zone" required>
      </div>
    </div>
    <div class="scan-inline scan-inline-equal">
      <div class="scan-field">
        <label class="form-label" for="loc_aisle">{% trans "Étagère" %}</label>
        <input type="text" id="loc_aisle" name="aisle" required>
      </div>
      <div class="scan-field">
        <label class="form-label" for="loc_shelf">Bac</label>
        <input type="text" id="loc_shelf" name="shelf" required>
      </div>
    </div>
    <div class="scan-inline scan-inline-equal">
      <div class="scan-field">
        <label class="form-label" for="loc_color">{% trans "Couleur rack" %}</label>
        <input type="text" id="loc_color" name="rack_color">
      </div>
      <div class="scan-field">
        <label class="form-label" for="loc_notes">{% trans "Notes" %}</label>
        <input type="text" id="loc_notes" name="notes">
      </div>
    </div>
    <button type="submit" class="scan-submit btn btn-primary">{% trans "Ajouter emplacement" %}</button>
  </form>

  <div class="scan-divider"></div>

  <form method="post" enctype="multipart/form-data" class="scan-filters ui-comp-form">
    {% csrf_token %}
    <input type="hidden" name="action" value="location_file">
    <div class="scan-field">
      <label class="form-label" for="location_file">{% trans "Fichier emplacements (CSV/XLS/XLSX)" %}</label>
      <input type="file" id="location_file" name="import_file" accept=".csv,.xlsx,.xls">
    </div>
    <div class="scan-filter-actions ui-comp-actions">
      <button type="submit" class="scan-submit secondary btn btn-secondary">{% trans "Importer emplacements" %}</button>
      <a href="{% static 'scan/import_templates/locations.csv' %}" class="scan-scan-btn btn btn-tertiary" download>
        {% trans "Template emplacements" %}
      </a>
      <a href="{% url 'scan:scan_import' %}?export=locations" class="scan-scan-btn btn btn-tertiary" download>
        {% trans "Exporter emplacements" %}
      </a>
    </div>
  </form>
</section>
