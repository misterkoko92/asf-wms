{% load i18n %}

<div
  id="shipment-recipient-preference-overlay"
  class="scan-choice-overlay"
  aria-hidden="true"
  hidden
>
  <div
    class="scan-choice-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="shipment-recipient-preference-title"
  >
    <div class="scan-choice-header">
      <strong id="shipment-recipient-preference-title">{% trans "Préférence destinataire" %}</strong>
    </div>
    <div class="scan-choice-status" id="shipment-recipient-preference-message"></div>
    <div class="scan-choice-actions ui-comp-actions">
      <button
        type="button"
        id="shipment-recipient-preference-accept"
        class="scan-submit scan-submit-inline btn btn-primary"
      >
        {% trans "Continuer" %}
      </button>
      <button
        type="button"
        id="shipment-recipient-preference-reject"
        class="scan-scan-btn btn btn-tertiary"
      >
        {% trans "Modifier" %}
      </button>
    </div>
  </div>
</div>
