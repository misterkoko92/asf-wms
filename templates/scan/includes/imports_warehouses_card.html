{% load i18n static wms_ui %}

<section id="scan-imports-warehouses" class="scan-card card border-0 ui-comp-card">
  <h2 class="ui-comp-title">{% trans "Import entrepôts" %}</h2>
  <form method="post" class="scan-filters ui-comp-form">
    {% csrf_token %}
    <input type="hidden" name="action" value="warehouse_single">
    <div class="scan-inline scan-inline-equal">
      <div class="scan-field">
        <label class="form-label" for="wh_name">{% trans "Nom entrepôt" %}</label>
        <input type="text" id="wh_name" name="name" required>
      </div>
      <div class="scan-field">
        <label class="form-label" for="wh_code">Code</label>
        <input type="text" id="wh_code" name="code">
      </div>
    </div>
    <button type="submit" class="scan-submit btn btn-primary">{% trans "Ajouter entrepôt" %}</button>
  </form>

  <div class="scan-divider"></div>

  <form method="post" enctype="multipart/form-data" class="scan-filters ui-comp-form">
    {% csrf_token %}
    <input type="hidden" name="action" value="warehouse_file">
    <div class="scan-field">
      <label class="form-label" for="warehouse_file">{% trans "Fichier entrepôts (CSV/XLS/XLSX)" %}</label>
      {% ui_file_input name="import_file" field_id="warehouse_file" accept=".csv,.xlsx,.xls" %}
    </div>
    <div class="scan-filter-actions ui-comp-actions">
      <button type="submit" class="scan-submit secondary btn btn-secondary">{% trans "Importer entrepôts" %}</button>
      <a href="{% static 'scan/import_templates/warehouses.csv' %}" class="scan-scan-btn btn btn-tertiary" download>
        {% trans "Template entrepôts" %}
      </a>
      <a href="{% url 'scan:scan_import' %}?export=warehouses" class="scan-scan-btn btn btn-tertiary" download>
        {% trans "Exporter entrepôts" %}
      </a>
    </div>
  </form>
</section>
