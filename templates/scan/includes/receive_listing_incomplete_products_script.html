<script>
  (function() {
    var bulkFieldName = document.getElementById('incomplete-bulk-field-name');
    var bulkTextValue = document.querySelector('[data-bulk-value="text"]');
    var bulkCategoryValue = document.querySelector('[data-bulk-value="category"]');
    var bulkLocationValue = document.querySelector('[data-bulk-value="location"]');
    var bulkBooleanValue = document.querySelector('[data-bulk-value="boolean"]');

    function syncBulkValueVisibility(fieldName) {
      if (!bulkFieldName) {
        return;
      }
      [bulkTextValue, bulkCategoryValue, bulkLocationValue, bulkBooleanValue].forEach(function(block) {
        if (block) {
          block.hidden = true;
        }
      });
      if (fieldName === 'category' && bulkCategoryValue) {
        bulkCategoryValue.hidden = false;
        return;
      }
      if (fieldName === 'default_location' && bulkLocationValue) {
        bulkLocationValue.hidden = false;
        return;
      }
      if ((fieldName === 'perishable' || fieldName === 'quarantine_default') && bulkBooleanValue) {
        bulkBooleanValue.hidden = false;
        return;
      }
      if (bulkTextValue) {
        bulkTextValue.hidden = false;
      }
    }

    if (bulkFieldName) {
      bulkFieldName.addEventListener('change', function() {
        syncBulkValueVisibility(bulkFieldName.value);
      });
      syncBulkValueVisibility(bulkFieldName.value);
    }
  })();
</script>
