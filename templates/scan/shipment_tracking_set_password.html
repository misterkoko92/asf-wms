<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Définir le mot de passe suivi expédition</title>
</head>
<body>
  <h1>Définir le mot de passe</h1>
  {% if invalid %}
    <p>Lien invalide.</p>
  {% else %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <input type="hidden" name="grant" value="{{ grant }}">
      {{ form.as_p }}
      <button type="submit">Enregistrer</button>
    </form>
  {% endif %}
</body>
</html>
