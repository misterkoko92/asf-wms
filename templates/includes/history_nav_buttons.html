<div class="ui-comp-actions history-nav-buttons">
  <button
    type="button"
    id="{{ history_nav_prefix }}-history-back"
    class="btn btn-tertiary btn-sm history-nav-button"
    aria-label="Page précédente"
    title="Page précédente"
    onclick="window.history.back();"
  >
    <span aria-hidden="true">&larr;</span>
  </button>
  <button
    type="button"
    id="{{ history_nav_prefix }}-history-forward"
    class="btn btn-tertiary btn-sm history-nav-button"
    aria-label="Page suivante"
    title="Page suivante"
    onclick="window.history.forward();"
  >
    <span aria-hidden="true">&rarr;</span>
  </button>
</div>
