<div class="{{ wrapper_classes }}">
  {{ input_html }}
  <label class="form-check-label scan-switch-label" for="{{ id }}">
    <span class="scan-switch-copy">
      <span{% if label_id %} id="{{ label_id }}"{% endif %} class="scan-switch-title">{{ label }}</span>
      {% if help_text %}
        <span{% if help_id %} id="{{ help_id }}"{% endif %} class="scan-switch-caption">{{ help_text }}</span>
      {% endif %}
    </span>
    <span class="scan-switch-control" aria-hidden="true">
      <span class="scan-switch-track">
        <span class="scan-switch-handle"></span>
      </span>
    </span>
  </label>
</div>
