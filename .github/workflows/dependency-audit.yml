name: Dependency Audit

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "Makefile"
      - ".github/dependabot.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/dependency-audit.yml"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.9"
          enable-cache: true

      - name: Run runtime dependency audit
        run: |
          set +e
          uv tool run --from pip-audit==2.10.0 pip-audit \
            -r requirements.txt \
            --disable-pip \
            --no-deps \
            --format json \
            --output pip-audit-report.json
          audit_status=$?
          set -e
          test -f pip-audit-report.json || echo '{"error":"pip-audit did not produce output"}' > pip-audit-report.json
          cat pip-audit-report.json
          exit "$audit_status"

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit-report.json
