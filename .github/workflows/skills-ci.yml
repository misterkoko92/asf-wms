name: Skills CI

on:
  push:
    paths:
      - ".github/workflows/skills-ci.yml"
      - "audits/audit.config.yaml"
      - "skills/**"
  pull_request:
    paths:
      - ".github/workflows/skills-ci.yml"
      - "audits/audit.config.yaml"
      - "skills/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install validator dependency
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate versioned repo skills
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          root = Path("skills")
          errors = []

          if not root.is_dir():
              errors.append("skills/ directory is missing")
          else:
              skill_dirs = sorted(path for path in root.iterdir() if path.is_dir())
              if not skill_dirs:
                  errors.append("skills/ must contain at least one skill directory")

              for directory in sorted(path for path in root.rglob("*") if path.is_dir()):
                  if not any(directory.iterdir()):
                      errors.append(f"{directory} is empty")

              for skill_dir in skill_dirs:
                  skill_file = skill_dir / "SKILL.md"
                  if not skill_file.is_file():
                      errors.append(f"{skill_dir} is missing SKILL.md")
                      continue

                  content = skill_file.read_text(encoding="utf-8").splitlines()
                  if not content or content[0] != "---":
                      errors.append(f"{skill_file} must start with YAML front matter")
                      continue

                  try:
                      closing_index = content[1:].index("---") + 1
                  except ValueError:
                      errors.append(f"{skill_file} front matter is not closed")
                      continue

                  front_matter = content[1:closing_index]
                  keys = {
                      line.split(":", 1)[0].strip()
                      for line in front_matter
                      if ":" in line and not line.lstrip().startswith("#")
                  }
                  for required_key in ("name", "description"):
                      if required_key not in keys:
                          errors.append(f"{skill_file} front matter is missing {required_key}")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)

          print("Versioned repo skills structure is valid.")
          PY

      - name: Validate local Codex skills (if available)
        run: |
          SKILLS_DIR="$HOME/.codex/skills"
          if [ ! -d "$SKILLS_DIR" ]; then
            echo "No $SKILLS_DIR found in this runner. Skipping skills validation."
            exit 0
          fi

          VALIDATOR="$SKILLS_DIR/.system/skill-creator/scripts/quick_validate.py"
          python "$VALIDATOR" "$SKILLS_DIR/audit-orchestrator"
          python "$VALIDATOR" "$SKILLS_DIR/audit-remediation"
          python "$VALIDATOR" "$SKILLS_DIR/e2e-test-designer"
          python "$VALIDATOR" "$SKILLS_DIR/release-gate"

      - name: Smoke test audit pipeline (if available)
        run: |
          SKILLS_DIR="$HOME/.codex/skills"
          if [ ! -d "$SKILLS_DIR" ]; then
            echo "No $SKILLS_DIR found in this runner. Skipping pipeline smoke test."
            exit 0
          fi

          TMP_DIR="$(mktemp -d)"
          python "$SKILLS_DIR/audit-orchestrator/scripts/run_audit_pipeline.py" \
            "CI smoke" \
            --repo-path "$GITHUB_WORKSPACE" \
            --base-dir "$TMP_DIR/audits" \
            --profile quick \
            --mode full \
            --artifact-cmd "echo ci-smoke" \
            --skip-e2e \
            --skip-remediation \
            --skip-gate

          test -f "$TMP_DIR/audits/INDEX.md"
